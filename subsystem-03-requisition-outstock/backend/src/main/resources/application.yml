server:
  port: ${PORT:8083}

spring:
  application:
    name: requisition-outstock
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:material_mgmt}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 跨子系统调用：库存变更唯一写入口在子系统②
material:
  purchase-service-url: ${PURCHASE_SERVICE_URL:http://localhost:8082}
  connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:5000}

# 统一认证接入（详见 docs/delivery/认证接入说明.md）
auth:
  # DBA 联调时置 true：未登录返回 HTTP 401，角色不符返回 HTTP 403
  enforce: ${AUTH_ENFORCE:false}
  token-expire-minutes: ${AUTH_TOKEN_EXPIRE_MINUTES:480}
  identity-cookie-name: ${AUTH_COOKIE_NAME:DBA_TOKEN}
  identity-user-header: ${AUTH_USER_HEADER:X-DBA-USER-ID}
  identity-role-header: ${AUTH_ROLE_HEADER:X-DBA-ROLE}
  identity-business-header: ${AUTH_BUSINESS_HEADER:X-DBA-BUSINESS-ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.school.material.requisition: ${LOG_LEVEL:info}
