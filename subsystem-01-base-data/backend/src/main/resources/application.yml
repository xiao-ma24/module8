server:
  port: ${PORT:8081}
  servlet:
    # 全局路由前缀：Controller 内只写业务路径
    # 统一改为 /api/v1/basedata，避免与子系统② 的 /api/v1/base 冲突
    context-path: /api/v1/basedata
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: material-base-data
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:material_mgmt}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:}
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 统一认证接入（详见 docs/delivery/认证接入说明.md）
auth:
  # DBA 联调时置 true：未登录返回 HTTP 401，角色不符返回 HTTP 403
  enforce: ${AUTH_ENFORCE:false}
  identity-cookie-name: ${AUTH_COOKIE_NAME:DBA_TOKEN}
  identity-user-header: ${AUTH_USER_HEADER:X-DBA-USER-ID}
  identity-role-header: ${AUTH_ROLE_HEADER:X-DBA-ROLE}
  identity-business-header: ${AUTH_BUSINESS_HEADER:X-DBA-BUSINESS-ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

logging:
  level:
    com.school.material.mapper: ${LOG_LEVEL:debug}
