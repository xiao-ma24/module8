# ============================================================
# 本地配置模板（示例）
# ------------------------------------------------------------
# 现已统一改为环境变量注入，推荐直接使用仓库根目录的 .env.example：
#   cp .env.example .env   → 修改 DB_PASS 等 → 启动脚本自动加载
#
# 如确实需要 Spring Profile 覆盖，可复制本文件为 application-local.yml
# （已在 .gitignore 中忽略，不会入库），并按环境修改后启动：
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/material_mgmt?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "你的密码"

ai:
  # 也可直接用环境变量 AI_BASE_URL / AI_API_KEY / AI_MODEL
  api-key: ""
