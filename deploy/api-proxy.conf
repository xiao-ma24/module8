# ---------------------------------------------------------------------------
# 统一登录 API 代理片段（被 nginx.conf 中每个前端 server 引入）
# 作用：先向认证服务核验 Cookie，拿到工号/角色后注入请求头，再按路径转发。
# 放置位置：/etc/nginx/snippets/module8-api.conf
# ---------------------------------------------------------------------------

# 认证子请求：Nginx 的 auth_request 只能发 GET，令牌通过请求头传入
location = /_campus_auth {
    internal;

    proxy_pass                    http://campus_auth/api/auth/internal/verify;
    proxy_pass_request_body       off;
    proxy_set_header              Content-Length "";
    proxy_set_header              X-Internal-Secret "REPLACE_WITH_SECRET";
    proxy_set_header              X-Session-Token   $cookie_CAMPUS_SESSION;

    # 认证服务不可用时按未登录处理，避免放行
    proxy_connect_timeout 2s;
    proxy_read_timeout    3s;
}

# 00 管理端
location /api/v1/admin/ {
    auth_request /_campus_auth;
    auth_request_set $uid   $upstream_http_x_user_id;
    auth_request_set $urole $upstream_http_x_user_role;
    auth_request_set $ubiz  $upstream_http_x_user_business;

    proxy_set_header X-DBA-USER-ID     $uid;
    proxy_set_header X-DBA-ROLE        $urole;
    proxy_set_header X-DBA-BUSINESS-ID $ubiz;
    proxy_set_header Host              $host;
    proxy_pass http://m08_00;
}

