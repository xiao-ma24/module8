# ---------------------------------------------------------------------------
# module8 · 统一登录集成 Nginx 示例
# 说明：
#   1. 认证服务与 6 个后端、6 份前端必须同域名（端口可不同），Cookie 才能共享；
#   2. 前端产物使用绝对路径 /assets/，每个站点必须部署在根路径；
#   3. X-Internal-Secret 与认证服务保持一致，不要写进前端；
#   4. 后端只监听 127.0.0.1，外部只暴露 Nginx。
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream campus_auth  { server 127.0.0.1:18080;  keepalive 16; }
upstream m08_00       { server 127.0.0.1:8080;   keepalive 16; }
upstream m08_01       { server 127.0.0.1:8081;   keepalive 16; }
upstream m08_02       { server 127.0.0.1:8082;   keepalive 16; }
upstream m08_03       { server 127.0.0.1:8083;   keepalive 16; }
upstream m08_04       { server 127.0.0.1:8084;   keepalive 16; }
upstream m08_05       { server 127.0.0.1:8085;   keepalive 16; }

# ===========================================================================
# 主站点：02 统一大系统（采购 / 领用 / 借用 / 盘点 / 基础数据）
# ===========================================================================
server {
    listen      5182;
    server_name material.example.com;

    root  /opt/module8/frontend;
    index index.html;

    include /etc/nginx/snippets/module8-api.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ===========================================================================
# 独立站点：00 / 01 / 03 / 04 / 05
# 各站点前端产物互不相同，均需放根路径
# ===========================================================================
server {
    listen      5180;
    server_name material.example.com;
    root  /opt/module8/frontend-m00;
    index index.html;
    include /etc/nginx/snippets/module8-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen      5173;
    server_name material.example.com;
    root  /opt/module8/frontend-m01;
    index index.html;
    include /etc/nginx/snippets/module8-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen      5183;
    server_name material.example.com;
    root  /opt/module8/frontend-m03;
    index index.html;
    include /etc/nginx/snippets/module8-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen      5184;
    server_name material.example.com;
    root  /opt/module8/frontend-m04;
    index index.html;
    include /etc/nginx/snippets/module8-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen      5185;
    server_name material.example.com;
    root  /opt/module8/frontend-m05;
    index index.html;
    include /etc/nginx/snippets/module8-api.conf;
    location / { try_files $uri $uri/ /index.html; }
}

# ===========================================================================
# 可选：把统一登录页与门户也挂到同一域名下（/ 与 /portal.html）
# 如果认证服务已有独立域名，可删除本段。
# ===========================================================================
server {
    listen      8089;
    server_name material.example.com;

    location / {
        proxy_pass http://campus_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
