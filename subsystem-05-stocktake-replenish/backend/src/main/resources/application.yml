server:
  port: ${PORT:8085}

spring:
  datasource:
    # 与团队约定一致：连接参数走环境变量，不在仓库写死地址与密码
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:material_mgmt}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

# 跨子系统地址（禁止在代码里硬编码 IP/端口）
material:
  base-service-url: ${BASE_SERVICE_URL:http://localhost:8081}      # 子系统① 基础数据与审批
  purchase-service-url: ${PURCHASE_SERVICE_URL:http://localhost:8082}  # 子系统② 库存变更唯一写入口

# 补货模型参数（报告 2.5 节，可按物资在 sys_config 中覆盖：
#   stocktake.pack_size.<materialId>、stocktake.lead_time.<materialId>、stocktake.cover_days）
stocktake:
  cover-days: ${STOCKTAKE_COVER_DAYS:30}          # Dc 覆盖天数
  lead-time-days: ${STOCKTAKE_LEAD_TIME_DAYS:7}   # L 采购提前期默认值（有≥2次入库流水时按入库间隔均值）
  near-expire-days: ${STOCKTAKE_NEAR_EXPIRE_DAYS:30}  # 临期预警提前天数（warning_rule.expire_days 优先）
  pack-size: ${STOCKTAKE_PACK_SIZE:1}             # P 包装规格默认值，1 表示不取整
  scan-enabled: ${STOCKTAKE_SCAN_ENABLED:true}    # 定时扫描开关；合并到 material-boot 后由统一调度，设 false
  scan-cron: ${STOCKTAKE_SCAN_CRON:0 0 2 * * ?}   # 每日 02:00 扫描预警

# 统一认证接入（详见 docs/delivery/认证接入说明.md）
auth:
  # DBA 联调时置 true：未登录返回 HTTP 401，角色不符返回 HTTP 403
  enforce: ${AUTH_ENFORCE:false}
  identity-cookie-name: ${AUTH_COOKIE_NAME:DBA_TOKEN}
  identity-user-header: ${AUTH_USER_HEADER:X-DBA-USER-ID}
  identity-role-header: ${AUTH_ROLE_HEADER:X-DBA-ROLE}
  identity-business-header: ${AUTH_BUSINESS_HEADER:X-DBA-BUSINESS-ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.school.material.stocktake: ${LOG_LEVEL:info}
